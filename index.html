<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車椅子ルート・バリアマップビューワー</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #control-panel {
      padding: 12px 20px;
      background-color: #2c3e50;
      color: #ecf0f1;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, button {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      font-size: 14px;
    }
    button {
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2980b9;
    }
    /* チェックボックス用のスタイル */
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .checkbox-label.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    .legend {
      background: white;
      padding: 10px 14px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 12px;
      line-height: 18px;
      color: #333;
    }
    .legend i {
      width: 12px;
      height: 12px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
      border-radius: 50%;
    }
  </style>
</head>
<body>

<div id="container">
  <div id="control-panel">
    <!-- 1. データ種別の選択 -->
    <div class="control-group">
      <label for="datatype-select"><strong>データ種別:</strong></label>
      <select id="datatype-select">
        <option value="cleansed">クレンジングデータ (平滑化済み)</option>
        <option value="raw">生データ (Raw Sensor Logs)</option>
      </select>
    </div>

    <!-- 2. マップマッチング用チェックボックス（クレンジング時のみ利用可能） -->
    <div class="control-group">
      <label id="osm-match-wrapper" class="checkbox-label">
        <input type="checkbox" id="chk-osm-match">
        <span>★ OSM道路補正 (マップマッチング)</span>
      </label>
    </div>

    <!-- 3. 対象ルートの選択（動的生成） -->
    <div class="control-group">
      <label for="mode-select"><strong>対象ルート:</strong></label>
      <select id="mode-select">
        <option value="">コース一覧を取得中...</option>
      </select>
    </div>

    <button id="btn-load">データを読み込み</button>
    <span id="status-msg" style="color: #f1c40f; font-size: 13px;"></span>
  </div>

  <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const SUPABASE_URL = '__SUPABASE_URL__';
  const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
  const BASE_URL = `${SUPABASE_URL}/functions/v1/get-viewer-data`;

  const map = L.map('map').setView([33.5895, 130.3990], 16);

  const osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap contributors'
  });
  const gsiStandardTile = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '国土地理院'
  });

  osmTile.addTo(map);
  L.control.layers({ "OpenStreetMap": osmTile, "国土地理院": gsiStandardTile }, null, { position: 'topright' }).addTo(map);

  const dataLayerGroup = L.layerGroup().addTo(map);

  // -------------------------------------------------------------------------
  // UI制御：データ種別に応じてチェックボックスの有効/無効を切り替える
  // -------------------------------------------------------------------------
  const dataTypeSelect = document.getElementById('datatype-select');
  const chkOsmMatch = document.getElementById('chk-osm-match');
  const osmMatchWrapper = document.getElementById('osm-match-wrapper');

  function updateUIState() {
    if (dataTypeSelect.value === 'cleansed') {
      chkOsmMatch.disabled = false;
      osmMatchWrapper.classList.remove('disabled');
    } else {
      chkOsmMatch.disabled = true;
      chkOsmMatch.checked = false; // 生データ時は強制オフ
      osmMatchWrapper.classList.add('disabled');
    }
  }

  dataTypeSelect.addEventListener('change', updateUIState);
  updateUIState(); // 初期状態の設定

  // -------------------------------------------------------------------------
  // 1. Supabase からコース一覧を取得してメニューを動的作成
  // -------------------------------------------------------------------------
  async function fetchTripList() {
    const selectElem = document.getElementById('mode-select');

    if (SUPABASE_URL.startsWith('__')) {
      selectElem.innerHTML = '<option value="">(Secrets未設定)</option>';
      return;
    }

    try {
      const response = await fetch(`${BASE_URL}?mode=trips`, {
        headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
      });
      
      if (!response.ok) throw new Error('コース一覧の取得に失敗しました');
      const json = await response.json();

      selectElem.innerHTML = '';

      if (json.trips && json.trips.length > 0) {
        json.trips.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.trip_id;
          opt.textContent = `街歩きコース (Trip ID: ${t.trip_id})`;
          selectElem.appendChild(opt);
        });

        loadData();
      } else {
        selectElem.innerHTML = '<option value="">コースが見つかりません</option>';
      }

    } catch (err) {
      console.error(err);
      selectElem.innerHTML = '<option value="">一覧取得エラー</option>';
    }
  }

  // -------------------------------------------------------------------------
  // 2. データの取得と描画
  // -------------------------------------------------------------------------
  async function loadData() {
    const dataType = dataTypeSelect.value;
    const isOsmMatchEnabled = chkOsmMatch.checked;
    const tripId = document.getElementById('mode-select').value;
    const statusMsg = document.getElementById('status-msg');

    if (!tripId) {
      alert('ルートを選択してください。');
      return;
    }

    dataLayerGroup.clearLayers();
    statusMsg.innerText = 'データを取得中...';

    try {
      // 生データ選択時
      if (dataType === 'raw') {
        const response = await fetch(`${BASE_URL}?mode=raw&trip_id=${tripId}&limit=80000`, {
          headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
        });
        const json = await response.json();
        statusMsg.innerText = '';
        renderRawData(json);
      } 
      // クレンジングデータ選択時
      else if (dataType === 'cleansed') {
        const response = await fetch(`${BASE_URL}?mode=course&trip_id=${tripId}`, {
          headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
        });
        const json = await response.json();

        // チェックボックスがオンなら「マップマッチング描画」、オフなら「通常クレンジング描画」
        if (isOsmMatchEnabled) {
          statusMsg.innerText = 'OSM歩道データにマッチング計算中...';
          await renderOSMMatchedData(json);
          statusMsg.innerText = '';
        } else {
          statusMsg.innerText = '';
          renderCourseData(json);
        }
      }

    } catch (err) {
      console.error(err);
      statusMsg.innerText = 'エラーが発生しました。';
      alert(`エラー: ${err.message}`);
    }
  }

  // クレンジング通常描画
  function renderCourseData(data) {
    const latLngs = [];
    if (data.route) {
      data.route.forEach(pt => {
        if (pt.coordinates && pt.coordinates.length === 2) latLngs.push(pt.coordinates);
      });
      if (latLngs.length > 0) {
        const polyline = L.polyline(latLngs, { color: '#2980b9', weight: 5, opacity: 0.8, fill: false });
        dataLayerGroup.addLayer(polyline);
        map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
      }
    }

    if (data.barriers && data.barriers.length > 0) {
      data.barriers.forEach(b => {
        if (b.coordinates) {
          const marker = L.circleMarker(b.coordinates, {
            radius: 7, fillColor: '#e74c3c', color: '#ffffff', weight: 2, fillOpacity: 0.9, fill: true
          }).bindPopup(`<b>バリア情報</b><br>タイプ: ${b.type}<br>衝撃度: ${b.intensity}`);
          dataLayerGroup.addLayer(marker);
        }
      });
    }
  }

  // 生データ描画
  function renderRawData(data) {
    if (!data.raw_logs) return;
    const latLngs = [];
    data.raw_logs.forEach(log => {
      if (log.gps_status === 'FIX' && log.lat > 20 && log.lon > 120) {
        latLngs.push([log.lat, log.lon]);
      }
    });

    if (latLngs.length > 0) {
      const rawPolyline = L.polyline(latLngs, {
        color: '#8e44ad', weight: 3, opacity: 0.8, fill: false, fillOpacity: 0.0
      });
      dataLayerGroup.addLayer(rawPolyline);
      map.fitBounds(rawPolyline.getBounds(), { padding: [30, 30] });
    }
  }

  // OSM道路マッチング描画
  async function renderOSMMatchedData(data) {
    if (!data.route || data.route.length === 0) {
      alert('補正対象のルートデータがありません。');
      return;
    }

    const rawCoords = [];
    data.route.forEach(pt => {
      if (pt.coordinates && pt.coordinates.length === 2) {
        rawCoords.push([pt.coordinates[1], pt.coordinates[0]]);
      }
    });

    if (rawCoords.length === 0) return;

    // 補正前のズレ軌跡（赤点線）
    const origLatLngs = rawCoords.map(c => [c[1], c[0]]);
    const origLine = L.polyline(origLatLngs, {
      color: '#e74c3c', weight: 2, dashArray: '5, 8', opacity: 0.6, fill: false
    });
    dataLayerGroup.addLayer(origLine);

    // バリア（段差等）ピン表示
    if (data.barriers && data.barriers.length > 0) {
      data.barriers.forEach(b => {
        if (b.coordinates) {
          const marker = L.circleMarker(b.coordinates, {
            radius: 7, fillColor: '#e74c3c', color: '#ffffff', weight: 2, fillOpacity: 0.9, fill: true
          }).bindPopup(`<b>バリア情報</b><br>タイプ: ${b.type}<br>衝撃度: ${b.intensity}`);
          dataLayerGroup.addLayer(marker);
        }
      });
    }

    // ダウンサンプリング処理
    const maxPoints = 40;
    const step = Math.max(1, Math.floor(rawCoords.length / maxPoints));
    const sampledCoords = [];

    for (let i = 0; i < rawCoords.length; i += step) {
      sampledCoords.push([
        Number(rawCoords[i][0].toFixed(5)),
        Number(rawCoords[i][1].toFixed(5))
      ]);
    }
    
    const lastPoint = [
      Number(rawCoords[rawCoords.length - 1][0].toFixed(5)),
      Number(rawCoords[rawCoords.length - 1][1].toFixed(5))
    ];
    if (sampledCoords[sampledCoords.length - 1].join(',') !== lastPoint.join(',')) {
      sampledCoords.push(lastPoint);
    }

    const coordString = sampledCoords.map(c => `${c[0]},${c[1]}`).join(';');
    const osrmUrl = `https://router.project-osrm.org/match/v1/foot/${coordString}?overview=full&geometries=geojson`;

    try {
      const osrmRes = await fetch(osrmUrl);
      if (!osrmRes.ok) throw new Error(`OSRM APIエラー (HTTP ${osrmRes.status})`);

      const osrmData = await osrmRes.json();

      if (osrmData.code === 'Ok' && osrmData.matchings && osrmData.matchings.length > 0) {
        osrmData.matchings.forEach(match => {
          const matchedLatLngs = match.geometry.coordinates.map(c => [c[1], c[0]]);
          const matchedPolyline = L.polyline(matchedLatLngs, {
            color: '#16a085', weight: 6, opacity: 0.9, fill: false
          });
          dataLayerGroup.addLayer(matchedPolyline);
          map.fitBounds(matchedPolyline.getBounds(), { padding: [30, 30] });
        });
      } else {
        alert('OSM道路ネットワーク上へのマッチング結果が得られませんでした。');
      }

    } catch (err) {
      console.error('マップマッチングエラー:', err);
      alert(`OSM道路補正に失敗しました。\n詳細: ${err.message}`);
    }
  }

  // イベント設定
  document.getElementById('btn-load').addEventListener('click', loadData);

  // 初期化
  fetchTripList();

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>表示凡例</b><br>';
    div.innerHTML += '<i style="background: #2980b9;"></i>補正なしルート (青)<br>';
    div.innerHTML += '<i style="background: #16a085;"></i>★ OSM補正ルート (緑)<br>';
    div.innerHTML += '<i style="background: #8e44ad;"></i>生データライン (紫)<br>';
    div.innerHTML += '<i style="background: #e74c3c;"></i>バリア / 元GPS軌跡<br>';
    return div;
  };
  legend.addTo(map);
</script>

</body>
</html>
