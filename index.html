<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車椅子ルート・バリアマップ＆環境ビューワー</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #control-panel {
      padding: 12px 20px;
      background-color: #2c3e50;
      color: #ecf0f1;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, button {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      font-size: 14px;
    }
    button {
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2980b9;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .checkbox-label.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    .legend {
      background: white;
      padding: 10px 14px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 12px;
      line-height: 18px;
      color: #333;
    }
    .legend i {
      width: 12px;
      height: 12px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
      border-radius: 50%;
    }
    .leaflet-tooltip {
      font-size: 13px;
    }
    .sensor-tooltip {
      font-weight: bold;
      border: 2px solid #333;
    }
  </style>
</head>
<body>

<div id="container">
  <div id="control-panel">
    <div class="control-group">
      <label for="datatype-select"><strong>データ種別:</strong></label>
      <select id="datatype-select">
        <option value="cleansed">クレンジングデータ (平滑化済み)</option>
        <option value="raw">生データ (Raw Sensor Logs)</option>
      </select>
    </div>

    <div class="control-group">
      <label id="osm-match-wrapper" class="checkbox-label">
        <input type="checkbox" id="chk-osm-match">
        <span>★ 経路マッチング (Turf+OSRM)</span>
      </label>
    </div>

    <div class="control-group">
      <label class="checkbox-label">
        <input type="checkbox" id="chk-show-loggers" checked>
        <span>🌡 熱中症ロガー表示</span>
      </label>
    </div>

    <div class="control-group">
      <label for="mode-select"><strong>対象ルート:</strong></label>
      <select id="mode-select">
        <option value="">コース一覧を取得中...</option>
      </select>
    </div>

    <button id="btn-load">データを読み込み</button>
    <span id="status-msg" style="color: #f1c40f; font-size: 13px;"></span>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>
  const SUPABASE_URL = '__SUPABASE_URL__';
  const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__'; // ※必ず正しいanonキーに置き換えてください
  const BASE_URL = `${SUPABASE_URL}/functions/v1/get-viewer-data`;
  const REST_URL = `${SUPABASE_URL}/rest/v1`;

  const map = L.map('map').setView([33.5895, 130.3990], 16);

  const osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap contributors'
  });
  const gsiStandardTile = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '国土地理院'
  });

  osmTile.addTo(map);
  L.control.layers({ "OpenStreetMap": osmTile, "国土地理院": gsiStandardTile }, null, { position: 'topright' }).addTo(map);

  const dataLayerGroup = L.layerGroup().addTo(map);
  const loggerLayerGroup = L.layerGroup().addTo(map);

  const dataTypeSelect = document.getElementById('datatype-select');
  const chkOsmMatch = document.getElementById('chk-osm-match');
  const osmMatchWrapper = document.getElementById('osm-match-wrapper');
  const chkShowLoggers = document.getElementById('chk-show-loggers');

  function updateUIState() {
    if (dataTypeSelect.value === 'cleansed') {
      chkOsmMatch.disabled = false;
      osmMatchWrapper.classList.remove('disabled');
    } else {
      chkOsmMatch.disabled = true;
      chkOsmMatch.checked = false;
      osmMatchWrapper.classList.add('disabled');
    }
  }

  dataTypeSelect.addEventListener('change', updateUIState);
  updateUIState();

  chkShowLoggers.addEventListener('change', () => {
    if (chkShowLoggers.checked) {
      loadSensorLoggers();
    } else {
      loggerLayerGroup.clearLayers();
    }
  });

  async function fetchTripList() {
    const selectElem = document.getElementById('mode-select');
    if (SUPABASE_URL.startsWith('__')) {
      selectElem.innerHTML = '<option value="">(Secrets未設定)</option>';
      return;
    }
    try {
      const response = await fetch(`${BASE_URL}?mode=trips`, {
        headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
      });
      if (!response.ok) throw new Error('コース一覧の取得に失敗しました');
      const json = await response.json();
      selectElem.innerHTML = '';
      if (json.trips && json.trips.length > 0) {
        json.trips.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.trip_id;
          opt.textContent = `街歩きコース (Trip ID: ${t.trip_id})`;
          selectElem.appendChild(opt);
        });
        loadData();
      } else {
        selectElem.innerHTML = '<option value="">コースが見つかりません</option>';
      }
    } catch (err) {
      console.error(err);
      selectElem.innerHTML = '<option value="">一覧取得エラー</option>';
    }
  }

  // 環境センサー（熱中症ロガー）データの取得と描画
  async function loadSensorLoggers() {
    loggerLayerGroup.clearLayers();
    if (SUPABASE_URL.startsWith('__') || SUPABASE_ANON_KEY.startsWith('__')) return;

    try {
      const response = await fetch(`${REST_URL}/device_current_status?select=*`, {
        headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
      });
      
      if (!response.ok) {
        if (response.status === 401) throw new Error('認証エラー (401): RLS設定またはAPIキーを確認してください。');
        throw new Error(`センサーデータの取得に失敗 (${response.status})`);
      }
      
      const devices = await response.json();

      devices.forEach(device => {
        let markerColor = '#00bcd4';
        if (device.temperature > 35) {
          markerColor = '#e74c3c';
        } else if (device.temperature > 30) {
          markerColor = '#f39c12';
        }

        const loggerIcon = L.divIcon({
          className: 'custom-logger-icon',
          html: `<div style="width: 14px; height: 14px; background-color: ${markerColor}; border: 2px solid #fff; transform: rotate(45deg); box-shadow: 1px 1px 3px rgba(0,0,0,0.5);"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });

        const marker = L.marker([device.lat, device.lon], { icon: loggerIcon, zIndexOffset: 1000 });
        const jstString = new Date(device.jst).toLocaleString('ja-JP');
        
        marker.bindTooltip(
          `<b>${device.device_name || device.device_id}</b><br>時刻: ${jstString}<br>気温: <span style="color:${markerColor};">${device.temperature}℃</span>`,
          { className: 'sensor-tooltip', direction: 'top' }
        );

        loggerLayerGroup.addLayer(marker);
      });
    } catch (err) {
      console.error('環境センサー取得エラー:', err);
    }
  }

  async function loadData() {
    const dataType = dataTypeSelect.value;
    const isOsmMatchEnabled = chkOsmMatch.checked;
    const tripId = document.getElementById('mode-select').value;
    const statusMsg = document.getElementById('status-msg');

    if (!tripId) {
      alert('ルートを選択してください。');
      return;
    }

    dataLayerGroup.clearLayers();
    statusMsg.innerText = 'データを取得中...';

    if (chkShowLoggers.checked) loadSensorLoggers();

    try {
      if (dataType === 'raw') {
        const response = await fetch(`${BASE_URL}?mode=raw&trip_id=${tripId}&limit=80000`, {
          headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
        });
        const json = await response.json();
        statusMsg.innerText = '';
        renderRawData(json);
      } 
      else if (dataType === 'cleansed') {
        const response = await fetch(`${BASE_URL}?mode=course&trip_id=${tripId}`, {
          headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
        });
        const json = await response.json();
        statusMsg.innerText = '';

        if (isOsmMatchEnabled) {
          await renderOSRMMatchedData(json);
        } else {
          renderCourseData(json);
        }
        
        renderStartEndMarkers(json);
      }
    } catch (err) {
      console.error(err);
      statusMsg.innerText = 'エラーが発生しました。';
      alert(`エラー: ${err.message}`);
    }
  }

  function renderCourseData(data) {
    const latLngs = [];
    if (data.route) {
      data.route.forEach(pt => {
        if (pt.coordinates && pt.coordinates.length === 2) latLngs.push(pt.coordinates);
      });
      if (latLngs.length > 0) {
        const polyline = L.polyline(latLngs, { color: '#2980b9', weight: 5, opacity: 0.8, fill: false });
        dataLayerGroup.addLayer(polyline);
        map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
      }
    }
    renderBarriers(data.barriers);
  }

  // Turf.jsによる転換点抽出とOSRM Map Matching APIでの補正 (重複座標フィルタリング追加)
  async function renderOSRMMatchedData(data) {
    const statusMsg = document.getElementById('status-msg');

    if (!data.route || data.route.length < 3) {
      alert('補正に必要なポイント数が足りません。');
      renderCourseData(data);
      return;
    }

    const rawLatLngs = [];
    const turfCoords = [];

    data.route.forEach(pt => {
      if (pt.coordinates && pt.coordinates.length === 2) {
        rawLatLngs.push(pt.coordinates);
        turfCoords.push([pt.coordinates[1], pt.coordinates[0]]);
      }
    });

    const origLine = L.polyline(rawLatLngs, {
      color: '#e74c3c', weight: 2, dashArray: '5, 8', opacity: 0.5, fill: false
    });
    dataLayerGroup.addLayer(origLine);

    try {
      statusMsg.innerText = 'OSRMで経路を補正中...';

      // 1. 同一座標および3メートル未満の微細なGPSブレを除外するフィルタリング
      const cleanCoords = [turfCoords[0]];
      for (let i = 1; i < turfCoords.length; i++) {
        const p1 = turf.point(cleanCoords[cleanCoords.length - 1]);
        const p2 = turf.point(turfCoords[i]);
        const dist = turf.distance(p1, p2, { units: 'meters' });
        
        if (dist > 3) {
          cleanCoords.push(turfCoords[i]);
        }
      }

      if (cleanCoords.length < 2) {
        throw new Error('ノイズ除去後、補正に必要な移動ポイントが不足しています。');
      }

      // 2. 進行方向による転換点の抽出
      const keyPoints = [cleanCoords[0]];
      let lastBearing = turf.bearing(turf.point(cleanCoords[0]), turf.point(cleanCoords[1]));

      for (let i = 1; i < cleanCoords.length - 1; i++) {
        const p1 = turf.point(cleanCoords[i]);
        const p2 = turf.point(cleanCoords[i+1]);
        const currentBearing = turf.bearing(p1, p2);
        
        let diff = Math.abs(currentBearing - lastBearing);
        if (diff > 180) diff = 360 - diff;
        
        if (diff > 15) {
          keyPoints.push(cleanCoords[i]);
          lastBearing = currentBearing;
        }
      }
      keyPoints.push(cleanCoords[cleanCoords.length - 1]);

      // 3. OSRM APIのポイント数上限対策
      const MAX_OSRM_POINTS = 90;
      let targetPoints = keyPoints;
      if (keyPoints.length > MAX_OSRM_POINTS) {
        const step = Math.ceil(keyPoints.length / MAX_OSRM_POINTS);
        targetPoints = keyPoints.filter((_, idx) => idx % step === 0);
        if (targetPoints[targetPoints.length - 1] !== keyPoints[keyPoints.length - 1]) {
          targetPoints.push(keyPoints[keyPoints.length - 1]);
        }
      }

      const coordsString = targetPoints.map(c => c.join(',')).join(';');
      const osrmUrl = `https://router.project-osrm.org/match/v1/foot/${coordsString}?overview=full&geometries=geojson&radiuses=${targetPoints.map(() => 20).join(';')}`;

      const osrmResponse = await fetch(osrmUrl);
      const osrmData = await osrmResponse.json();

      if (osrmData.code === 'Ok' && osrmData.matchings && osrmData.matchings.length > 0) {
        const matchedGeom = osrmData.matchings[0].geometry;
        const matchedLatLngs = matchedGeom.coordinates.map(c => [c[1], c[0]]);

        const matchedPolyline = L.polyline(matchedLatLngs, {
          color: '#16a085', weight: 6, opacity: 0.9, fill: false
        });
        dataLayerGroup.addLayer(matchedPolyline);
        map.fitBounds(matchedPolyline.getBounds(), { padding: [30, 30] });
        statusMsg.innerText = '';
      } else {
        throw new Error('OSRMによるマッチング結果が得られませんでした。');
      }

    } catch (e) {
      console.error('OSRM matching error:', e);
      statusMsg.innerText = '経路マッチングに失敗したため、通常描画を行います。';
      renderCourseData(data);
    }

    renderBarriers(data.barriers);
  }

  // バリアマーカー描画（ホバー時にツールチップ表示）
  function renderBarriers(barriers) {
    if (barriers && barriers.length > 0) {
      barriers.forEach(b => {
        if (b.coordinates) {
          const marker = L.circleMarker(b.coordinates, {
            radius: 7, fillColor: '#e74c3c', color: '#ffffff', weight: 2, fillOpacity: 0.9, fill: true
          }).bindTooltip(`<b>バリア情報</b><br>タイプ: ${b.type}<br>衝撃度: ${b.intensity}`, {
            direction: 'top'
          });
          dataLayerGroup.addLayer(marker);
        }
      });
    }
  }

  // スタート・ゴール地点マーカー描画
  function renderStartEndMarkers(data) {
    if (!data.route || data.route.length === 0) return;

    const startPt = data.route[0].coordinates;
    const endPt = data.route[data.route.length - 1].coordinates;

    const createLabelIcon = (text, bgColor) => L.divIcon({
      className: 'custom-label-icon',
      html: `<div style="background:${bgColor}; color:white; font-weight:bold; width:24px; height:24px; line-height:24px; text-align:center; border-radius:50%; border:2px solid white; box-shadow:0 2px 5px rgba(0,0,0,0.3); font-size:12px;">${text}</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    L.marker(startPt, { icon: createLabelIcon('S', '#2ecc71') })
      .addTo(dataLayerGroup)
      .bindTooltip('スタート地点', { direction: 'top' });

    L.marker(endPt, { icon: createLabelIcon('G', '#e74c3c') })
      .addTo(dataLayerGroup)
      .bindTooltip('ゴール地点', { direction: 'top' });
  }

  function renderRawData(data) {
    if (!data.raw_logs) return;
    const latLngs = [];
    data.raw_logs.forEach(log => {
      if (log.gps_status === 'FIX' && log.lat > 20 && log.lon > 120) {
        latLngs.push([log.lat, log.lon]);
      }
    });
    if (latLngs.length > 0) {
      const rawPolyline = L.polyline(latLngs, {
        color: '#8e44ad', weight: 3, opacity: 0.8, fill: false, fillOpacity: 0.0
      });
      dataLayerGroup.addLayer(rawPolyline);
      map.fitBounds(rawPolyline.getBounds(), { padding: [30, 30] });
    }
  }

  document.getElementById('btn-load').addEventListener('click', loadData);
  fetchTripList();
  
  loadSensorLoggers();

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>表示凡例</b><br>';
    div.innerHTML += '<i style="background: #2980b9;"></i>通常ルート (青)<br>';
    div.innerHTML += '<i style="background: #16a085;"></i>★ OSRM補正ルート (緑)<br>';
    div.innerHTML += '<i style="background: #8e44ad;"></i>生データライン (紫)<br>';
    div.innerHTML += '<i style="background: #e74c3c;"></i>バリア / 元GPS軌跡<br>';
    div.innerHTML += '<i style="background: #2ecc71; border: 1px solid #ccc;"></i>S スタート地点<br>';
    div.innerHTML += '<i style="background: #e74c3c; border: 1px solid #ccc;"></i>G ゴール地点<br>';
    div.innerHTML += '<hr style="margin: 5px 0; border: 0; border-top: 1px solid #ccc;">';
    div.innerHTML += '<b>センサー</b><br>';
    div.innerHTML += '<i style="background: #e74c3c; border-radius: 0; transform: rotate(45deg); margin: 2px 8px 2px 2px;"></i>35度超 (赤)<br>';
    div.innerHTML += '<i style="background: #f39c12; border-radius: 0; transform: rotate(45deg); margin: 2px 8px 2px 2px;"></i>30度超 (オレンジ)<br>';
    div.innerHTML += '<i style="background: #00bcd4; border-radius: 0; transform: rotate(45deg); margin: 2px 8px 2px 2px;"></i>安全域 (水色)<br>';
    return div;
  };
  legend.addTo(map);
</script>

</body>
</html>
