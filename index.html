<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車椅子ルート・バリアマップビューワー</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #control-panel {
      padding: 12px 20px;
      background-color: #2c3e50;
      color: #ecf0f1;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, button {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      font-size: 14px;
    }
    button {
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2980b9;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    .legend {
      background: white;
      padding: 10px 14px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 12px;
      line-height: 18px;
      color: #333;
    }
    .legend i {
      width: 12px;
      height: 12px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
      border-radius: 50%;
    }
  </style>
</head>
<body>

<div id="container">
  <div id="control-panel">
    <!-- データタイプの切り替え（OSMマップマッチングモードを追加） -->
    <div class="control-group">
      <label for="datatype-select"><strong>データ種別:</strong></label>
      <select id="datatype-select">
        <option value="cleansed">クレンジングデータ (表示軽量化)</option>
        <option value="raw">生データ (Raw Sensor Logs)</option>
        <option value="osm_matched">★ OSM道路補正 (マップマッチング)</option>
      </select>
    </div>

    <!-- コース・経路の選択 -->
    <div class="control-group">
      <label for="mode-select"><strong>対象ルート:</strong></label>
      <select id="mode-select">
        <option value="course_3">街歩きコース (Trip ID: 3)</option>
        <option value="course_4">街歩きコース (Trip ID: 4)</option>
      </select>
    </div>

    <button id="btn-load">データを読み込み</button>
    <span id="status-msg" style="color: #f1c40f; font-size: 13px;"></span>
  </div>

  <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const SUPABASE_URL = '__SUPABASE_URL__';
  const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
  const BASE_URL = `${SUPABASE_URL}/functions/v1/get-viewer-data`;

  const map = L.map('map').setView([33.5895, 130.3990], 16);

  const osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  });

  const gsiStandardTile = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '国土地理院'
  });

  osmTile.addTo(map);

  const baseMaps = {
    "OpenStreetMap (デフォルト)": osmTile,
    "国土地理院 (標準地図)": gsiStandardTile
  };
  L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

  const dataLayerGroup = L.layerGroup().addTo(map);

  async function loadData() {
    const dataType = document.getElementById('datatype-select').value;
    const mode = document.getElementById('mode-select').value;
    const statusMsg = document.getElementById('status-msg');

    if (SUPABASE_URL.startsWith('__')) {
      alert('SupabaseのURLが設定されていません。');
      return;
    }

    dataLayerGroup.clearLayers();
    statusMsg.innerText = 'データを取得中...';

    const tripId = mode === 'course_3' ? 3 : 4;

    try {
      // 1. クレンジングデータ表示
      if (dataType === 'cleansed') {
        const response = await fetch(`${BASE_URL}?mode=course&trip_id=${tripId}`, {
          headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
        });
        const json = await response.json();
        statusMsg.innerText = '';
        renderCourseData(json);
      } 
      // 2. 生データ表示
      else if (dataType === 'raw') {
        const response = await fetch(`${BASE_URL}?mode=raw&trip_id=${tripId}&limit=80000`, {
          headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
        });
        const json = await response.json();
        statusMsg.innerText = '';
        renderRawData(json);
      }
      // 3. OSMマップマッチング（道路補正）モード
      else if (dataType === 'osm_matched') {
        statusMsg.innerText = 'クレンジングデータ取得中...';
        const response = await fetch(`${BASE_URL}?mode=course&trip_id=${tripId}`, {
          headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
        });
        const json = await response.json();
        
        statusMsg.innerText = 'OSM歩道データにマッチング計算中...';
        await renderOSMMatchedData(json);
        statusMsg.innerText = '';
      }

    } catch (err) {
      console.error(err);
      statusMsg.innerText = 'エラーが発生しました。';
      alert(`エラー: ${err.message}`);
    }
  }

  // クレンジング描画
  function renderCourseData(data) {
    const latLngs = [];
    if (data.route) {
      data.route.forEach(pt => {
        if (pt.coordinates && pt.coordinates.length === 2) latLngs.push(pt.coordinates);
      });
      if (latLngs.length > 0) {
        const polyline = L.polyline(latLngs, { color: '#2980b9', weight: 5, opacity: 0.8, fill: false });
        dataLayerGroup.addLayer(polyline);
        map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
      }
    }
  }

  // 生データ描画
  function renderRawData(data) {
    if (!data.raw_logs) return;
    const latLngs = [];
    data.raw_logs.forEach(log => {
      if (log.gps_status === 'FIX' && log.lat > 20 && log.lon > 120) {
        latLngs.push([log.lat, log.lon]);
      }
    });

    if (latLngs.length > 0) {
      const rawPolyline = L.polyline(latLngs, {
        color: '#8e44ad',
        weight: 3,
        opacity: 0.8,
        fill: false,
        fillOpacity: 0.0
      });
      dataLayerGroup.addLayer(rawPolyline);
      map.fitBounds(rawPolyline.getBounds(), { padding: [30, 30] });
    }
  }

  // ★ 4. マップマッチング (OSRM API呼び出し処理)
  async function renderOSMMatchedData(data) {
    if (!data.route || data.route.length === 0) {
      alert('補正対象のルートデータがありません。');
      return;
    }

    // クレンジング点から座標配列を整理 [lon, lat] 形式 (OSRM仕様)
    const rawCoords = [];
    data.route.forEach(pt => {
      if (pt.coordinates && pt.coordinates.length === 2) {
        // [lat, lon] -> [lon, lat] に変換
        rawCoords.push([pt.coordinates[1], pt.coordinates[0]]);
      }
    });

    // OSRM Match API は1回につき100点程度までを推奨するため、サンプリング間隔を調整
    const sampledCoords = [];
    const step = Math.max(1, Math.floor(rawCoords.length / 80)); 
    for (let i = 0; i < rawCoords.length; i += step) {
      sampledCoords.push(rawCoords[i]);
    }
    // 終点を確実に追加
    if (sampledCoords[sampledCoords.length - 1] !== rawCoords[rawCoords.length - 1]) {
      sampledCoords.push(rawCoords[rawCoords.length - 1]);
    }

    // 座標文字列をセミコロン区切りで結合 "lon,lat;lon,lat;..."
    const coordString = sampledCoords.map(c => `${c[0]},${c[1]}`).join(';');
    
    // OSRM 歩行者(foot) マップマッチング URL
    const osrmUrl = `https://router.project-osrm.org/match/v1/foot/${coordString}?overview=full&geometries=geojson`;

    try {
      const osrmRes = await fetch(osrmUrl);
      if (!osrmRes.ok) throw new Error('OSRM APIからの応答エラー');
      const osrmData = await osrmRes.json();

      if (osrmData.code === 'Ok' && osrmData.matchings && osrmData.matchings.length > 0) {
        // 1. 元のズレている軌跡（薄い点線で比較用に表示）
        const origLatLngs = rawCoords.map(c => [c[1], c[0]]);
        const origLine = L.polyline(origLatLngs, {
          color: '#e74c3c',
          weight: 2,
          dashArray: '5, 8',
          opacity: 0.6,
          fill: false
        });
        dataLayerGroup.addLayer(origLine);

        // 2. OSMの歩道上にスナップ（補正）された美しい軌跡
        osrmData.matchings.forEach(match => {
          // GeoJSON [lon, lat] を Leaflet [lat, lon] に変換
          const matchedLatLngs = match.geometry.coordinates.map(c => [c[1], c[0]]);
          
          const matchedPolyline = L.polyline(matchedLatLngs, {
            color: '#16a085', // エメラルドグリーン
            weight: 6,
            opacity: 0.9,
            fill: false
          });
          
          dataLayerGroup.addLayer(matchedPolyline);
          map.fitBounds(matchedPolyline.getBounds(), { padding: [30, 30] });
        });

      } else {
        alert('OSM道路ネットワーク上へのマッチングに失敗しました。');
      }

    } catch (err) {
      console.error('マップマッチングエラー:', err);
      alert('OSM道路補正処理中にエラーが発生しました。');
    }
  }

  document.getElementById('btn-load').addEventListener('click', loadData);
  loadData();

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>表示凡例</b><br>';
    div.innerHTML += '<i style="background: #2980b9;"></i>走行ルート (通常)<br>';
    div.innerHTML += '<i style="background: #16a085;"></i>★ OSM補正ルート (歩道吸着)<br>';
    div.innerHTML += '<i style="background: #e74c3c;"></i>元GPS軌跡 (点線)<br>';
    return div;
  };
  legend.addTo(map);
</script>

</body>
</html>
